apply plugin: 'com.android.application'

// Version comes from package.json ("1.2.3" -> versionName 1.2.3, versionCode 10203).
// Bump it there before every APK you share, or phones will refuse to update.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def appVersionCode = appVersion.tokenize('.').collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

// One app per brand (brands/<id>/brand.json): Zain Life and the personal app. Each is a product flavor
// with its own app id, so both can sit on the same phone. build-apk.ps1 -Brand <id> picks one.
def brands = file('../../brands').listFiles().findAll { new File(it, 'brand.json').exists() }
    .sort { it.name }.collect { new groovy.json.JsonSlurper().parse(new File(it, 'brand.json')) }

// Release signing: each brand has its own key. android/<key.props> (never committed) points at it;
// build-apk.ps1 -Release creates both. Zain: keystore.properties, personal: keystore-personal.properties.
def brandKeys = [:]
brands.each { b ->
    def f = file("../${b.key.props}")
    if (f.exists()) { def p = new Properties(); f.withInputStream { p.load(it) }; brandKeys[b.id] = p }
}

android {
    namespace = "com.personal.lifeplanner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        brandKeys.each { id, p ->
            create(id) {
                storeFile file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }
    flavorDimensions = ['brand']
    productFlavors {
        brands.each { b ->
            create(b.id) {
                dimension = 'brand'
                applicationId = b.appId
                // Release builds use the brand's key; debug builds keep the PC's debug key.
                if (brandKeys[b.id]) { signingConfig = signingConfigs.getByName(b.id) }
            }
        }
    }
    // Release builds would first run a "lint vital" check that downloads Capacitor's unit-test libraries
    // (mockito, hamcrest...) from Maven Central. Some company networks block those .jar files and none of
    // them end up in the APK, so skip it. Run '.\gradlew lintZainRelease' in android\ to lint by hand.
    lint { checkReleaseBuilds = false }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
